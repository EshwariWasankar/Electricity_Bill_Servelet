# Server configuration
server.port=8080

# Application name
spring.application.name=vit-result-management-system

# MongoDB connection
# Update the URI below if your MongoDB is not running locally on the default port
spring.data.mongodb.uri=mongodb://localhost:27017/vit_result_db

# Jackson - don't fail on empty beans, pretty print for readability during dev
spring.jackson.serialization.indent-output=true

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.vit.result=DEBUG
